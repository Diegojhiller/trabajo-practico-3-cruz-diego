<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Buscador de personajes de Dragon Ball</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="assets/css/style.css">
    </head>
        <body>
            <div class="container my-5">
                <h1 class="text-center mb-4">Podés ver a los personajes de Dragon Ball</h1>

                <div class="input-group mb-3">

                    <button id="btnLimpiar" class="btn btn-secondary"><b>Limpiar</b></button>
                </div>

                <div id="aviso" class="text-center mb-3"></div>

                <div id="zonaResultados" class="row row-cols-1 row-cols-md-3 g-4 mt-3"></div>
            </div>

            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

            <script src="assets/js/script.js"></script>
        </body>
</html>
