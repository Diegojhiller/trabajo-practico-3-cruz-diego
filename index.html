<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de personajes de Dragon Ball</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container my-5">
        <h1 class="text-center mb-4">Podés ver a los personajes de Dragon Ball</h1>

        <!-- Grupo de búsqueda -->
        <div class="input-group mb-3">
            <!-- input: cambia el id a "campoBusqueda" para que coincida con el JS -->
            <input id="campoBusqueda" type="text" class="form-control" placeholder="Escribí un nombre...">

            <!-- botón de buscar -->
            <button id="btnBuscar" class="btn btn-primary">Buscar</button>

            <!-- botón de limpiar -->
            <button id="btnLimpiar" class="btn btn-secondary">Limpiar</button>
        </div>

        <!-- Acá se mostrará el mensaje de error o información -->
        <div id="aviso" class="text-center mb-3"></div>

        <!-- Contenedor para los personajes -->
        <div id="zonaResultados" class="row row-cols-1 row-cols-md-3 g-4 mt-3"></div>
    </div>

    <!-- Bootstrap JS opcional (para modales, etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Tu script JavaScript -->
    <script src="assets/js/script.js"></script>
</body>
</html>
